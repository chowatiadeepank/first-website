<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6b4e71">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Event Planner</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="top-row">
      <h1 id="eventName">Event Planner</h1>
      <button class="btn btn-sm btn-outline" style="color:white;border-color:rgba(255,255,255,0.5)" onclick="showEventSwitcher()">
        Switch
      </button>
    </div>
    <div class="subtitle" id="eventDate"></div>
  </header>

  <div class="container" id="mainContent">
    <!-- Will be filled by JS -->
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="icon">📊</span>
      Dashboard
    </a>
    <a href="guests.html" class="nav-item">
      <span class="icon">👥</span>
      Guests
    </a>
    <a href="events.html" class="nav-item">
      <span class="icon">📅</span>
      Events
    </a>
    <a href="documents.html" class="nav-item">
      <span class="icon">📄</span>
      Docs
    </a>
    <a href="share.html" class="nav-item">
      <span class="icon">📤</span>
      Share
    </a>
  </nav>

  <!-- Event Switcher Modal -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Your Events</h3>
        <button class="btn btn-sm btn-outline" onclick="closeEventModal()">Close</button>
      </div>
      <div class="modal-body" id="eventList">
        <!-- filled by JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="showCreateEvent()">+ New Event</button>
      </div>
    </div>
  </div>

  <!-- Create Event Modal -->
  <div class="modal-overlay" id="createEventModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Create New Event</h3>
        <button class="btn btn-sm btn-outline" onclick="closeCreateEvent()">Close</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Event Name *</label>
          <input type="text" class="form-control" id="newEventName" placeholder="e.g. Sharma Wedding 2027">
        </div>
        <div class="form-group">
          <label>Date (optional)</label>
          <input type="date" class="form-control" id="newEventDate">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeCreateEvent()">Cancel</button>
        <button class="btn btn-primary" onclick="createNewEvent()">Create</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function renderDashboard() {
      const event = App.getCurrentEvent();
      const container = document.getElementById('mainContent');
      const nameEl = document.getElementById('eventName');
      const dateEl = document.getElementById('eventDate');

      if (!event) {
        nameEl.textContent = 'Event Planner';
        dateEl.textContent = '';
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🎉</div>
            <h2>Welcome!</h2>
            <p>Create your first event to start managing guests, rooms, gifts and more.</p>
            <button class="btn btn-primary" onclick="showCreateEvent()">+ Create Event</button>
          </div>
        `;
        return;
      }

      nameEl.textContent = event.name;
      dateEl.textContent = event.date ? new Date(event.date).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : 'No date set';

      const stats = App.getEventStats(event);

      container.innerHTML = `
        <div class="stat-grid">
          <div class="stat-card">
            <div class="value">${stats.totalFamilies}</div>
            <div class="label">Families</div>
          </div>
          <div class="stat-card">
            <div class="value">${stats.totalPeople}</div>
            <div class="label">Total Guests</div>
          </div>
          <div class="stat-card">
            <div class="value">${stats.confirmed}</div>
            <div class="label">Confirmed</div>
          </div>
          <div class="stat-card">
            <div class="value">${stats.attended}</div>
            <div class="label">Attended</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">💰 Shagan & Gifts</div>
          <div class="flex-between">
            <div>
              <div class="text-muted text-sm">Total Shagan Received</div>
              <div style="font-size:1.4rem;font-weight:700;color:var(--primary)">${App.formatMoney(stats.totalShagan)}</div>
            </div>
            <div style="text-align:right">
              <div class="text-muted text-sm">Return Gifts Pending</div>
              <div style="font-size:1.4rem;font-weight:700;color:var(--warning)">${stats.returnGiftPending}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">🛏️ Rooms Overview</div>
          <div class="flex-between">
            <div>
              <div class="text-muted text-sm">Rooms Allotted</div>
              <div style="font-size:1.4rem;font-weight:700;color:var(--primary)">${stats.totalRooms}</div>
            </div>
            <div style="text-align:right">
              <div class="text-muted text-sm">Families with Rooms</div>
              <div style="font-size:1.4rem;font-weight:700">${event.guests.filter(g => g.rooms > 0).length}</div>
            </div>
          </div>
          <p class="text-sm text-muted mt-1">You can update room numbers from the Guests page. Dashboard will refresh automatically.</p>
        </div>

        <div class="card">
          <div class="card-title">📅 Sub-Events</div>
          ${event.subEvents.map(se => {
            const seStats = App.getEventStats(event, se.id);
            return `
              <div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--border)">
                <div>
                  <strong>${se.name}</strong>
                  ${se.date ? `<div class="text-sm text-muted">${se.date}</div>` : ''}
                </div>
                <div class="text-sm text-muted">
                  ${seStats.invited} invited · ${seStats.confirmed} confirmed
                </div>
              </div>
            `;
          }).join('')}
          <a href="events.html" class="btn btn-outline btn-sm mt-1" style="width:100%">Manage Sub-Events</a>
        </div>

        <div class="card">
          <div class="card-title">Quick Actions</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <a href="guests.html" class="btn btn-primary btn-block">👥 Manage Guest List</a>
            <a href="share.html" class="btn btn-outline btn-block">📤 Share / Export Lists</a>
            <a href="documents.html" class="btn btn-outline btn-block">📄 Banquet Terms & Documents</a>
          </div>
        </div>
      `;
    }

    function showEventSwitcher() {
      const data = App.loadData();
      const list = document.getElementById('eventList');
      if (!data.events.length) {
        list.innerHTML = `<p class="text-muted text-center">No events yet.</p>`;
      } else {
        list.innerHTML = data.events.map(e => `
          <div class="card" style="margin-bottom:10px;cursor:pointer" onclick="switchToEvent('${e.id}')">
            <div class="flex-between">
              <div>
                <strong>${e.name}</strong>
                <div class="text-sm text-muted">${e.guests.length} families · ${e.subEvents.length} functions</div>
              </div>
              ${data.currentEventId === e.id ? '<span class="badge badge-confirmed">Current</span>' : ''}
            </div>
          </div>
        `).join('');
      }
      document.getElementById('eventModal').classList.add('show');
    }

    function closeEventModal() {
      document.getElementById('eventModal').classList.remove('show');
    }

    function switchToEvent(id) {
      App.setCurrentEvent(id);
      closeEventModal();
      renderDashboard();
    }

    function showCreateEvent() {
      closeEventModal();
      document.getElementById('newEventName').value = '';
      document.getElementById('newEventDate').value = '';
      document.getElementById('createEventModal').classList.add('show');
    }

    function closeCreateEvent() {
      document.getElementById('createEventModal').classList.remove('show');
    }

    function createNewEvent() {
      const name = document.getElementById('newEventName').value.trim();
      if (!name) {
        alert('Please enter an event name');
        return;
      }
      const date = document.getElementById('newEventDate').value;
      App.createEvent(name, date);
      closeCreateEvent();
      renderDashboard();
    }

    // Init
    renderDashboard();
  </script>
</body>
</html>
